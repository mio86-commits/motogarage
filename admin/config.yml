backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "moto"
    label: "Мотоциклы в наличии"
    files:
      - name: "moto_list"
        label: "Список мотоциклов"
        file: "data/moto.json"
        fields:
          - label: "Мотоциклы"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID (латиницей, например: ninja-400-2017)", name: "id", widget: "string" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Короткое описание (для главной)", name: "desc", widget: "string" }
              - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
              - { label: "Главное фото", name: "image", widget: "image" }
              - { label: "Галерея (доп. фото)", name: "gallery", widget: "list", required: false, field: { label: "Фото", name: "image", widget: "image" } }
              - { label: "Полное описание (для страницы)", name: "body", widget: "markdown" }

  - name: "akrap"
    label: "Выхлоп Akrapovič"
    files:
      - name: "akrap_list"
        label: "Список выхлопов"
        file: "data/akrap.json"
        fields:
          - label: "Выхлопы"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID (латиницей, например: akrap-yamaha)", name: "id", widget: "string" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Короткое описание (для главной)", name: "desc", widget: "string" }
              - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
              - { label: "Главное фото", name: "image", widget: "image" }
              - { label: "Галерея (доп. фото)", name: "gallery", widget: "list", required: false, field: { label: "Фото", name: "image", widget: "image" } }
              - { label: "Полное описание (для страницы)", name: "body", widget: "markdown" }

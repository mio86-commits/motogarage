backend:
  name: github
  repo: mio86-commits/motogarage
  branch: main
  base_url: https://motogarage-nsk.ru
  auth_endpoint: /admin/client.html

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://motogarage-nsk.ru
display_url: https://motogarage-nsk.ru

collections:
  - name: "moto"
    label: "Мотоциклы"
    folder: "data/moto"
    create: true
    slug: "{{title | slugify}}"  # Имя файла создается из названия (Kawasaki Ninja 400 -> kawasaki-ninja-400)
    extension: "json"
    fields:
      - { label: "ID (ссылка на товар)", name: "id", widget: "string", hint: "Оставь пустым, если хочешь, чтобы ID совпадал с названием файла. Или впиши вручную (латиницей)." }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Цена", name: "price", widget: "string" }
      - { label: "Короткое описание", name: "desc", widget: "string" }
      - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути", "Продан"], default: "В наличии" }
      - { label: "Главное фото", name: "image", widget: "image" }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "🖼️ {{fields.image}}"
        field: { label: "Фото", name: "image", widget: "image" }
      - label: "Характеристики"
        name: "specs"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Название", name: "label", widget: "string" }
          - { label: "Значение", name: "value", widget: "string" }
      - label: "Главные фишки"
        name: "features"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.text}}"
        field: { label: "Фишка", name: "text", widget: "string" }
      - { label: "Описание", name: "docs", widget: "markdown", required: false, modes: ["rich_text", "raw"] }

  - name: "akrap"
    label: "Выхлоп Akrapovič"
    folder: "data/akrap"
    create: true
    slug: "{{title | slugify}}"  # Имя файла создается из названия (Yamaha MT-09 -> yamaha-mt-09)
    extension: "json"
    fields:
      - { label: "ID (ссылка на товар)", name: "id", widget: "string", hint: "Оставь пустым, если хочешь, чтобы ID совпадал с названием файла. Или впиши вручную (латиницей)." }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Цена", name: "price", widget: "string" }
      - { label: "Короткое описание", name: "desc", widget: "string" }
      - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути", "Продан"], default: "В наличии" }
      - { label: "Главное фото", name: "image", widget: "image" }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "🖼️ {{fields.image}}"
        field: { label: "Фото", name: "image", widget: "image" }
      - label: "Характеристики"
        name: "specs"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Название", name: "label", widget: "string" }
          - { label: "Значение", name: "value", widget: "string" }
      - label: "Главные фишки"
        name: "features"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.text}}"
        field: { label: "Фишка", name: "text", widget: "string" }
      - { label: "Полное описание", name: "body", widget: "markdown", required: false, modes: ["rich_text", "raw"] }

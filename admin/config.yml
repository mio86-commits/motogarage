backend:
  name: github
  repo: mio86-commits/motogarage
  branch: main
  base_url: https://decap-auth.mio86.workers.dev
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "moto"
    label: "Мотоциклы в наличии"
    files:
      - name: "moto_list"
        label: "Список мотоциклов"
        file: "data/moto.json"
        fields:
          - label: "Мотоциклы"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID (латиницей, напр. ninja-2017)", name: "id", widget: "string" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Короткое описание (для карточки)", name: "desc", widget: "string" }
              - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
              - { label: "Главное фото", name: "image", widget: "image" }
              - { label: "Галерея (доп. фото)", name: "gallery", widget: "list", required: false, field: { label: "Фото", name: "image", widget: "image" } }
              - label: "Характеристики (Таблица)"
                name: "specs"
                widget: "list"
                required: false
                fields:
                  - { label: "Название (напр. Год выпуска)", name: "label", widget: "string" }
                  - { label: "Значение (напр. 2015 г.)", name: "value", widget: "string" }
              - label: "Главные фишки (Список)"
                name: "features"
                widget: "list"
                required: false
                field: { label: "Фишка", name: "text", widget: "string" }
              - { label: "Документы и доставка", name: "docs", widget: "markdown", required: false }

  - name: "akrap"
    label: "Выхлоп Akrapovič"
    files:
      - name: "akrap_list"
        label: "Список выхлопов"
        file: "data/akrap.json"
        fields:
          - label: "Выхлопы"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID (латиницей)", name: "id", widget: "string" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Короткое описание (для карточки)", name: "desc", widget: "string" }
              - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
              - { label: "Главное фото", name: "image", widget: "image" }
              - { label: "Галерея (доп. фото)", name: "gallery", widget: "list", required: false, field: { label: "Фото", name: "image", widget: "image" } }
              - label: "Характеристики (Таблица)"
                name: "specs"
                widget: "list"
                required: false
                fields:
                  - { label: "Название", name: "label", widget: "string" }
                  - { label: "Значение", name: "value", widget: "string" }
              - { label: "Полное описание", name: "body", widget: "markdown", required: false }

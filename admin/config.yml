backend:
  name: github
  repo: mio86-commits/motogarage
  branch: main
  base_url: https://motogarage-nsk.ru
  auth_endpoint: /admin/client.html

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://motogarage-nsk.ru
display_url: https://motogarage-nsk.ru

collections:
  - name: "moto"
    label: "Мотоциклы"
    folder: "data/moto"
    create: true
    slug: "{{fields.id}}"
    extension: "json"
    fields:
      - { label: "ID (латиницей)", name: "id", widget: "string" }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Цена", name: "price", widget: "string" }
      - { label: "Короткое описание", name: "desc", widget: "string" }
      - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
      - { label: "Главное фото", name: "image", widget: "image" }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "Фото добавлено"
        media_library:
          config:
            allow_multiple: true
        field: { label: "Фото", name: "image", widget: "image" }
      - label: "Характеристики"
        name: "specs"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.label}}: {{fields.value}}" # Показывает "Год: 2017" в свернутом виде
        fields:
          - { label: "Название", name: "label", widget: "string" }
          - { label: "Значение", name: "value", widget: "string" }
      - label: "Главные фишки"
        name: "features"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.text}}" # Показывает сам текст фишки в свернутом виде
        field: { label: "Фишка", name: "text", widget: "string" }
      - { label: "Описание (Документы)", name: "docs", widget: "markdown", required: false, modes: ["rich_text", "raw"] }

  - name: "akrap"
    label: "Выхлоп Akrapovič"
    folder: "data/akrap"
    create: true
    slug: "{{fields.id}}"
    extension: "json"
    fields:
      - { label: "ID (латиницей)", name: "id", widget: "string" }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Цена", name: "price", widget: "string" }
      - { label: "Короткое описание", name: "desc", widget: "string" }
      - { label: "Статус", name: "status", widget: "select", options: ["В наличии", "В пути"], default: "В наличии" }
      - { label: "Главное фото", name: "image", widget: "image" }
      - label: "Галерея"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        summary: "Фото добавлено"
        field: { label: "Фото", name: "image", widget: "image" }
      - label: "Характеристики"
        name: "specs"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Название", name: "label", widget: "string" }
          - { label: "Значение", name: "value", widget: "string" }
      - label: "Главные фишки"
        name: "features"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.text}}"
        field: { label: "Фишка", name: "text", widget: "string" }
      - { label: "Полное описание", name: "body", widget: "markdown", required: false, modes: ["rich_text", "raw"] }

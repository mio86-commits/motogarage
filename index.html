  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header .wrap { justify-content: center; } .contact-text { display: none; } .speedo-icon { width: 28px; height: 28px; margin-top: 10px; } .logo { font-size: 18px; gap: 6px; } .logo-nsk { font-size: 12px; } }
  
  .card { background: #16161a; border-radius: 12px; overflow: hidden; border: 1px solid #24242a; transition: 0.3s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-5px); border-color: #ff5a1f; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  .card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #222; }
  .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }

  #loader { text-align: center; padding: 50px; color: #ff5a1f; font-weight: bold; }

<div class="wrap">
  <div class="catalog-header">
    <h1>Каталог</h1>
  </div>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('moto', this)">🏍️ Мотоциклы</div>
    <div class="tab" onclick="switchTab('akrap', this)">💨 Выхлоп Akrapovič</div>
  </div>

  <div class="grid" id="catalogGrid"></div>
  <div id="loader">Загрузка каталога...</div>
</div>

<script>
  let currentTab = 'moto';
  const CACHE_KEY = 'motogarage_catalog_v2';
  const CACHE_TTL = 60 * 1000; // 1 минута

  // Функция получения списка файлов из GitHub API
  async function fetchItemList(folder) {
    const url = `https://api.github.com/repos/ВАШ_ЛОГИН/ВАШ_РЕПОЗИТОРИЙ/contents/data/${folder}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Ошибка GitHub API: ' + res.status);
    const files = await res.json();
    return files.filter(f => f.name.endsWith('.json')).map(f => f.name.replace('.json', ''));
  }

  // Функция загрузки одного товара
  async function fetchItem(folder, id) {
    const res = await fetch(`data/${folder}/${id}.json`);
    if (!res.ok) return null;
    return await res.json();
  }

  // Отрисовка карточек
  async function renderCatalog(folder) {
    const loader = document.getElementById('loader');
    const grid = document.getElementById('catalogGrid');
    loader.style.display = 'block';
    grid.innerHTML = '';

    try {
      // Проверяем кэш
      const cached = localStorage.getItem(CACHE_KEY + '_' + folder);
      if (cached) {
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < CACHE_TTL) {
          drawCards(data, folder);
          loader.style.display = 'none';
          // В фоне обновляем
          updateCache(folder);
          return;
        }
      }
      await updateCache(folder);
    } catch (err) {
      loader.innerText = "Ошибка: " + err.message;
    }
  }

  async function updateCache(folder) {
    const grid = document.getElementById('catalogGrid');
    const loader = document.getElementById('loader');
    try {
      // ВАЖНО: Замени ВАШ_ЛОГИН и ВАШ_РЕПОЗИТОРИЙ на свои данные!
      const repoOwner = 'ВАШ_ЛОГИН';
      const repoName = 'ВАШ_РЕПОЗИТОРИЙ';
      const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/data/${folder}`;
      
      const res = await fetch(url);
      if (!res.ok) throw new Error('GitHub API: ' + res.status);
      const files = await res.json();
      const jsonFiles = files.filter(f => f.name.endsWith('.json'));

      const items = [];
      for (const file of jsonFiles) {
        const item = await fetchItem(folder, file.name.replace('.json', ''));
        if (item) items.push(item);
      }

      // Сохраняем в кэш
      localStorage.setItem(CACHE_KEY + '_' + folder, JSON.stringify({
        data: items,
        timestamp: Date.now()
      }));

      if (currentTab === folder) {
        drawCards(items, folder);
        loader.style.display = 'none';
      }
    } catch (err) {
      loader.innerText = "Ошибка загрузки: " + err.message;
    }
  }

  function drawCards(items, folder) {
    const grid = document.getElementById('catalogGrid');
    if (!items.length) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#9a9a9a; padding:20px;">Товаров пока нет</div>';
      return;
    }

    grid.innerHTML = items.map(item => {
      const title = item.title || 'Без названия';
      const price = item.price || 'Цена по запросу';
      const image = item.image || 'favicon.png';
      const status = item.status === 'В пути' ? '🚢 В пути' : '✅ В наличии';
      // Формируем ID файла (без .json)
      const fileId = (item.id || title).toLowerCase().replace(/[^a-z0-9]+/g, '-');
      
      // Формируем ссылку. Используем encodeURIComponent для ID
      const link = `product.html?type=${folder}&id=${encodeURIComponent(fileId)}`;
      
      return `
        <a href="${link}" class="card">
          <img src="${image}" alt="${title}" class="card-img" loading="lazy">
          <div class="card-body">
            <div class="card-status">${status}</div>
            <div class="card-title">${title}</div>
            <div class="card-price">${price}</div>
          </div>
        </a>
      `;
    }).join('');
  }

  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    renderCatalog(tab);
  }

  // Старт
  renderCatalog('moto');
</script>

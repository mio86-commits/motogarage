<script>
(function() {
  try {
    var p = new URLSearchParams(window.location.search);
    var t = p.get('type') || 'moto';
    var i = p.get('id') || '';
    var base = 'https://motogarage-nsk.ru/';
    var cleanId = i.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    // Красивый канонический URL (совпадает с пререндером, если он включён)
    var canonical = i ? base + 'product/' + t + '/' + cleanId + '.html' : base + 'index.html';
    document.getElementById('canonicalLink').setAttribute('href', canonical);
    var ogUrl = document.createElement('meta');
    ogUrl.setAttribute('property', 'og:url');
    ogUrl.setAttribute('content', canonical);
    document.head.appendChild(ogUrl);
  } catch (e) { /* ignore */ }
})();
</script>

<script>
  let currentImages = [];
  let currentIndex = 0;

  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || 'moto';
  const id = params.get('id');

  // === Утилиты ===
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Нормализация пути картинки в абсолютный URL
  function absoluteImageUrl(p) {
    if (!p) return window.location.origin + '/favicon.png';
    p = String(p).trim();
    if (/^https?:\/\//i.test(p)) return p;
    p = p.replace(/^\/+/, '');
    return window.location.origin + '/' + encodeURI(p);

  function parseMarkdown(text) {
    if (!text) return '';
    const emojiMap = {
      ':fire:': '🔥', ':white_check_mark:': '✅', ':heavy_check_mark:': '✔️',
      ':star:': '⭐', ':star2:': '🌟', ':motorcycle:': '🏍️', ':dash:': '💨',

      ':clipboard:': '📋', ':passport_control:': '🛂', ':memo:': '📝'
    };
    let processedText = text;
    for (const [code, emoji] of Object.entries(emojiMap)) {
      processedText = processedText.split(code).join(emoji);
    }
    if (typeof marked !== 'undefined') {
      return marked.parse(processedText, { breaks: true });
    }
    return processedText.replace(/\n/g, '<br>');
  }

    document.getElementById('loading').innerText = "Ошибка: Товар не найден.";

        if (!res.ok) throw new Error("Файл товара не найден");
        return res.json();

            .replace(/\s+/g, ' ')
            .trim()
            .substring(0, 160) + '...';
        }
        const imageUrl = absoluteImageUrl(item.image);
        const canonical = window.location.origin + '/product/' + type + '/' + cleanId + '.html';

        function setMeta(selector, value) {
          const el = document.querySelector(selector);
          if (el) el.setAttribute('content', value);
        }
        setMeta('meta[name="description"]', cleanDescription);
        setMeta('meta[property="og:title"]', (item.title || 'Товар') + ' — MotoGarage NSK');

        setMeta('meta[property="og:image"]', imageUrl);
        setMeta('meta[property="og:url"]', window.location.href);

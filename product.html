<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка... — MotoGarage NSK</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0e0e10; color:#eaeaea; line-height:1.6; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
  
  header { padding: 12px 0; border-bottom: 1px solid #222; margin-bottom: 15px; }
  header .wrap { display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 12px;}
  .logo { display: flex; align-items: center; font-weight: 900; font-size: 22px; text-transform: uppercase; color: #fff; gap: 10px; line-height: 1; }
  .speedo-icon { width: 34px; height: 34px; flex-shrink: 0; display: block; margin-top: 14px; }
  .logo-badge { border: 2px solid #ff5a1f; color: #ff5a1f; padding: 2px 6px; border-radius: 6px; margin: 0 4px; }
  .logo-nsk { font-size: 14px; color: #777; font-weight: 600; }
  .back-link { color: #9a9a9a; font-size: 14px; display: block; margin-bottom: 10px; }
  
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 800px) { .product-grid { grid-template-columns: 1fr; gap: 20px; } }
  
  .gallery { display: flex; flex-direction: column; gap: 10px; }
  .main-img { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #24242a; aspect-ratio: 4/3; background: #16161a; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .main-img::-webkit-scrollbar { display: none; }
  .main-img img { flex: 0 0 100%; scroll-snap-align: start; width: 100%; height: 100%; object-fit: contain; background: #16161a; }
  
  .thumbs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb { width: 70px; height: 70px; flex-shrink: 0; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.6; }
  .thumb.active { opacity: 1; border-color: #ff5a1f; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  
  .info-block h1 { font-size: 28px; margin-bottom: 8px; line-height: 1.2; }
  .badge { display: inline-block; background: #ff5a1f22; color: #ff5a1f; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 10px; margin-right: 5px; }
  .badge-blue { background: #0077FF22; color: #4da6ff; }
  .price { font-size: 32px; font-weight: 800; color: #ff5a1f; margin-bottom: 24px; margin-top: 10px; }
  .desc-title { font-size: 18px; margin-bottom: 10px; color: #fff; margin-top: 20px; }
  .desc-text { color: #b5b5b5; font-size: 15px; margin-bottom: 20px; }
  .desc-text p { margin-bottom: 10px; }
  .desc-text strong { color: #fff; }
  
  .btn-buy { display: block; width: 100%; text-align: center; background: #ff5a1f; color: #fff; padding: 16px; border-radius: 10px; font-weight: 700; font-size: 18px; transition: 0.2s; margin-top: 20px; }
  .btn-buy:hover { opacity: 0.9; }
</style>
</head>
<body>

<header>
  <div class="wrap" style="padding-top:0; padding-bottom:0;">
    <a href="index.html" class="logo">
      <svg class="speedo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#444" stroke-width="7" stroke-linecap="round"/>
        <path d="M 10 50 L 18 50" stroke="#777" stroke-width="4"/>
        <path d="M 30 20 L 34 26" stroke="#777" stroke-width="4"/>
        <path d="M 50 10 L 50 18" stroke="#777" stroke-width="4"/>
        <path d="M 70 20 L 66 26" stroke="#777" stroke-width="4"/>
        <path d="M 90 50 L 82 50" stroke="#777" stroke-width="4"/>
        <g class="needle"><path d="M 45 50 L 55 50 L 50 15 Z" fill="#ff5a1f" /></g>
        <circle cx="50" cy="50" r="8" fill="#fff" />
        <circle cx="50" cy="50" r="4" fill="#ff5a1f" />
      </svg>
      <div>MOTO <span class="logo-badge">GARAGE</span> <span class="logo-nsk">NSK</span></div>
    </a>
  </div>
</header>

<div class="wrap">
  <a href="index.html" class="back-link">← Вернуться в каталог</a>
  <div class="product-grid" id="product-content" style="display: none;">
    <!-- Данные вставятся сюда через скрипт -->
  </div>
  <div id="loading" style="text-align:center; padding: 50px; color: #ff5a1f; font-weight: bold;">Загрузка данных...</div>
</div>

<script>
  // Получаем ID из ссылки (например, product.html?id=ninja-400&type=moto)
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || 'moto'; // 'moto' или 'akrap'
  const id = params.get('id');

  if (!id) {
    document.getElementById('loading').innerText = "Ошибка: Товар не найден.";
  } else {
    fetch(`data/${type}.json`)
      .then(res => res.json())
      .then(data => {
        const item = data.items.find(i => i.id === id);
        if (!item) throw new Error("Товар не найден");

        document.title = item.title + " — MotoGarage NSK";
        
        // Формируем галерею (главное фото + доп фото)
        let allImages = [item.image];
        if (item.gallery) {
          item.gallery.forEach(g => allImages.push(g.image));
        }

        let mainImgHtml = `<img id="mainPhoto" src="${allImages[0]}" alt="${item.title}">`;
        let thumbsHtml = '';
        allImages.forEach((img, index) => {
          thumbsHtml += `<div class="thumb ${index===0?'active':''}" onclick="changePhoto('${img}', this)"><img src="${img}"></div>`;
        });

        const statusBadge = item.status === 'В пути' ? '<span class="badge badge-blue">🚢 В пути</span>' : '<span class="badge">В наличии</span>';

        // Вставляем HTML
        document.getElementById('product-content').innerHTML = `
          <div class="gallery">
            <div class="main-img" id="mainSlider">${mainImgHtml}</div>
            <div class="thumbs">${thumbsHtml}</div>
          </div>
          <div class="info-block">
            <h1>${item.title}</h1>
            <div>${statusBadge}</div>
            <div class="price">${item.price}</div>
            <div class="desc-title">Описание</div>
            <div class="desc-text">${item.body || item.desc}</div>
            
            <div style="text-align: center; margin-top: 20px; padding: 15px; background: #16161a; border: 1px solid #24242a; border-radius: 10px;">
                <div style="color: #9a9a9a; font-size: 14px; margin-bottom: 8px;">Связаться напрямую:</div>
                <a href="tel:+79833112444" style="display: inline-block; font-size: 24px; font-weight: 800; color: #ff5a1f; text-decoration: none; padding: 8px 16px; background: #24242a; border-radius: 8px;">+7 (983) 311-24-44</a>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <a href="https://t.me/Ivan_IM_Moto" target="_blank" class="btn-buy" style="flex: 1;">✈️ Telegram</a>
                <a href="https://max.ru/u/f9LHodD0cOIYpSD8AUCYkLZKmE0f8CdTlq5y6NLPn32YOVnJ2PjDBT_Iim0" target="_blank" class="btn-buy" style="flex: 1; background: #0077FF;">MAX</a>
            </div>
          </div>
        `;
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('product-content').style.display = 'grid';
      })
      .catch(err => {
        document.getElementById('loading').innerText = "Ошибка загрузки: " + err.message;
      });
  }

  function changePhoto(src, element) {
    document.getElementById('mainPhoto').src = src;
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    element.classList.add('active');
  }
</script>
</body>
</html>

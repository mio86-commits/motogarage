  /* Галерея */

  .thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }

  .thumb:hover, .thumb.active { opacity: 1; border-color: #ff5a1f; }

  /* Инфо */
  .info-block h1 { font-size: 26px; margin-bottom: 8px; line-height: 1.2; }
  .badge { display: inline-block; background: #ff5a1f22; color: #ff5a1f; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 10px; margin-right: 5px; }
  .badge-blue { background: #0077FF22; color: #4da6ff; }
  .price { font-size: 32px; font-weight: 800; color: #ff5a1f; margin-bottom: 24px; margin-top: 10px; }
  .specs { list-style: none; margin-bottom: 30px; border-top: 1px solid #24242a; border-bottom: 1px solid #24242a; padding: 20px 0; }
  .specs li { display: flex; margin-bottom: 12px; font-size: 15px; }
  .specs li:last-child { margin-bottom: 0; }
  .specs .label { width: 160px; color: #9a9a9a; flex-shrink: 0; }

  .desc-title { font-size: 18px; margin-bottom: 10px; color: #fff; }
  .desc-text { color: #b5b5b5; font-size: 15px; margin-bottom: 20px; }
  .desc-text p { margin-bottom: 10px; }

  /* Стили для Markdown-элементов внутри описания */

  .features-list li:last-child { margin-bottom: 0; }
  
  /* Кнопки */

  /* Модалка */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }

  .modal-content { max-width: 90%; max-height: 90vh; object-fit: contain; border-radius: 8px; animation: zoomIn 0.3s ease; }

  .modal-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1001; }
  .modal-prev, .modal-next { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 30px; font-weight: bold; cursor: pointer; padding: 15px; user-select: none; z-index: 1001; background: rgba(255,255,255,0.1); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
  .modal-prev:hover, .modal-next:hover { background: #ff5a1f; }
  .modal-prev { left: 20px; }
  .modal-next { right: 20px; }
  @media (max-width: 800px) { .modal-prev, .modal-next { width: 45px; height: 45px; font-size: 20px; } .modal-close { font-size: 35px; top: 10px; right: 15px; } }

<script>
  let currentImages = [];
  let currentIndex = 0;

  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || 'moto';
  const id = params.get('id');

  // НОВАЯ ФУНКЦИЯ ПАРСИНГА MARKDOWN И СМАЙЛОВ
  function parseMarkdown(text) {
    if (!text) return '';
    
    // 1. Замена смайлов
    const emojiMap = {
      ':fire:': '🔥',
      ':white_check_mark:': '✅',
      ':heavy_check_mark:': '✔️',
      ':star:': '⭐',
      ':star2:': '🌟',
      ':motorcycle:': '🏍️',
      ':dash:': '💨',
      ':zap:': '⚡',
      ':wrench:': '🔧',
      ':hammer_and_wrench:': '🛠️',
      ':gear:': '⚙️',
      ':shield:': '🛡️',
      ':warning:': '⚠️',
      ':x:': '❌',
      ':moneybag:': '💰',
      ':thumbsup:': '👍',
      ':100:': '💯',
      ':gift:': '🎁',
      ':page_facing_up:': '📄',
      ':clipboard:': '📋',
      ':passport_control:': '🛂',
      ':memo:': '📝'
    };
    
    let processedText = text;
    for (const [code, emoji] of Object.entries(emojiMap)) {
      processedText = processedText.split(code).join(emoji);
    }

    // 2. Защита: если библиотека не загрузилась (нет интернета или заблокирована)
    if (typeof marked !== 'undefined') {
      return marked.parse(processedText);
    } else {
      // Просто делаем переносы строк, чтобы текст не превратился в сплошную кашу
      return processedText.replace(/\n/g, '<br>');
    }
  }

  if (!id) {
    document.getElementById('loading').innerText = "Ошибка: Товар не найден.";
  } else {
    fetch(`data/${type}/${id}.json`)
      .then(res => {
        if (!res.ok) throw new Error("Файл товара не найден");
        return res.json();
      })
      .then(item => {
        document.title = item.title + " — MotoGarage NSK";
        
        currentImages = [];
        if (item.image) currentImages.push(item.image);
        if (item.gallery && Array.isArray(item.gallery)) { 
            item.gallery.forEach(g => {
                if (typeof g === 'string' && g.trim() !== '') currentImages.push(g);
                else if (g && typeof g === 'object' && g.image) currentImages.push(g.image);
            }); 
        }
        if (currentImages.length === 0) currentImages.push('favicon.png'); 

        let mainImgHtml = '';
        let thumbsHtml = '';
        currentImages.forEach((img, index) => {
          mainImgHtml += `<img src="${img}" alt="${item.title}" onclick="handleImgClick(${index})">`;
          thumbsHtml += `<div class="thumb ${index===0?'active':''}" onclick="changePhoto(${index}, this)"><img src="${img}"></div>`;
        });

        const statusBadge = item.status === 'В пути' ? '<span class="badge badge-blue">🚢 В пути</span>' : '<span class="badge">В наличии</span>';

        let specsHtml = '';
        if (item.specs && Array.isArray(item.specs) && item.specs.length > 0) {
          specsHtml = '<ul class="specs">';
          item.specs.forEach(spec => {
            if (spec.label || spec.value) {
              specsHtml += `<li><span class="label">${spec.label || ''}</span><span class="value">${spec.value || ''}</span></li>`;
            }
          });
          specsHtml += '</ul>';
        }

        let featuresHtml = '';
        if (item.features && Array.isArray(item.features) && item.features.length > 0) {
          let tempFeatures = '';
          item.features.forEach(feat => {
            let text = typeof feat === 'string' ? feat : (feat && feat.text ? feat.text : '');
            if (text.trim() !== '') tempFeatures += `<li>🔥 ${text}</li>`;
          });
          if (tempFeatures !== '') {
             featuresHtml = `<div class="desc-title">Главные фишки:</div><ul class="features-list">${tempFeatures}</ul>`;
          }
        }

        let docsHtml = '';
        const rawText = item.docs || item.body || '';
        if (rawText && rawText.trim() !== '') {
          docsHtml = `<div class="desc-title" style="margin-top:20px;">Описание</div><div class="desc-text">${parseMarkdown(rawText)}</div>`;
        }

        document.getElementById('product-content').innerHTML = `
          <div class="gallery">
            <div class="main-img" id="mainSlider">${mainImgHtml}</div>
            <div class="thumbs">${thumbsHtml}</div>
          </div>
          <div class="info-block">
            <h1>${item.title || 'Без названия'}</h1>
            <div>${statusBadge}</div>
            <div class="price">${item.price || 'Цена по запросу'}</div>
            ${specsHtml}
            ${featuresHtml}
            ${docsHtml}
            <div style="text-align: center; margin-top: 20px; padding: 15px; background: #16161a; border: 1px solid #24242a; border-radius: 10px;">
                <div style="color: #9a9a9a; font-size: 14px; margin-bottom: 8px;">Связаться напрямую:</div>
                <a href="tel:+79833112444" style="display: inline-block; font-size: 24px; font-weight: 800; color: #ff5a1f; text-decoration: none; padding: 8px 16px; background: #24242a; border-radius: 8px;">+7 (983) 311-24-44</a>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                <a href="https://t.me/Ivan_IM_Moto" target="_blank" class="btn-buy" style="display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; min-width: 140px; margin-top: 0; text-decoration: none; font-size: 16px;">
                    <svg style="fill: #fff; width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg> Telegram
                </a>
                <a href="https://max.ru/u/f9LHodD0cOIYpSD8AUCYkLZKmE0f8CdTlq5y6NLPn32YOVnJ2PjDBT_Iim0" target="_blank" class="btn-buy" style="display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; min-width: 140px; margin-top: 0; background: #0077FF; color: #fff; text-decoration: none; font-size: 16px;">
                    <span style="display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 50%; width: 24px; height: 24px;">
                        <img src="MAX.png" alt="MAX" style="height: 16px; width: auto; border-radius: 2px;">
                    </span> MAX
                </a>
            </div>
          </div>
        `;
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('product-content').style.display = 'grid';
        initGallery();
      })
      .catch(err => {
        document.getElementById('loading').innerText = "Ошибка загрузки: " + err.message;
      });
  }

  function initGallery() {
    const slider = document.getElementById('mainSlider');
    const thumbs = document.querySelectorAll('.thumb');
    let touchStartX = 0, touchStartY = 0, isSwiping = false;

    slider.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; isSwiping = false;
    }, { passive: true });

    slider.addEventListener('touchmove', (e) => {
      if (Math.abs(e.touches[0].clientX - touchStartX) > 10 || Math.abs(e.touches[0].clientY - touchStartY) > 10) isSwiping = true;
    }, { passive: true });

    slider.addEventListener('click', (e) => {
      if (isSwiping) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    slider.addEventListener('scroll', () => { 
      const index = Math.round(slider.scrollLeft / slider.clientWidth); 
      if (thumbs[index]) { 
        thumbs.forEach(t => t.classList.remove('active')); 
        thumbs[index].classList.add('active'); 
      } 
    });
  }

  function changePhoto(index, element) { 
    const slider = document.getElementById('mainSlider');
    slider.scrollTo({ left: index * slider.clientWidth, behavior: 'smooth' }); 
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active')); 
    if (element) element.classList.add('active'); 
  }

  function handleImgClick(index) {
    currentIndex = index;
    document.getElementById('modalImg').src = currentImages[currentIndex];
    document.getElementById('photoModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('photoModal').classList.remove('show');
    document.body.style.overflow = '';
    changePhoto(currentIndex, document.querySelectorAll('.thumb')[currentIndex]);
  }

  function changeModalPhoto(direction) {
    currentIndex += direction;
    if (currentIndex < 0) currentIndex = currentImages.length - 1;
    if (currentIndex >= currentImages.length) currentIndex = 0;
    document.getElementById('modalImg').src = currentImages[currentIndex];
  }

  document.addEventListener('keydown', function(event) { 
    const modal = document.getElementById('photoModal');
    if (modal.classList.contains('show')) { 
      if (event.key === 'Escape') closeModal(); 
      if (event.key === 'ArrowLeft') changeModalPhoto(-1); 
      if (event.key === 'ArrowRight') changeModalPhoto(1); 
    } 
  });

  document.getElementById('photoModal').addEventListener('click', function(event) {
    if (event.target === this) closeModal();
  });
</script>
